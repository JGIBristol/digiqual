# Briefcase project for the DigiQual desktop app (Windows MSI/zip, macOS DMG).
#
# The app is the published digiqual wheel -- including its compiled C++
# extension and the GUI in digiqual.gui -- installed into Briefcase's embedded
# Python; src/digiqual_desktop is just a two-line entry point. Briefcase
# pip-installs real wheels instead of freezing imports, so there are no hidden
# imports, collect-all lists or .spec files to maintain.
#
# Build locally with `just build_app_local`; CI builds it in build_app.yml.
# `requires` resolves digiqual from a local wheelhouse when PIP_FIND_LINKS
# points at one (as both of those do), otherwise from PyPI.

[tool.briefcase]
project_name = "DigiQual"
bundle = "uk.ac.bristol"
version = "0.26.2"
url = "https://jgibristol.github.io/digiqual/"
license = "MIT"
license-files = ["../LICENCE"]
author = "Josh Tyler"
author_email = "josh.tyler@bristol.ac.uk"

[tool.briefcase.app.digiqual-desktop]
formal_name = "DigiQual"
description = "Statistical Toolkit for Reliability Assessment in NDT"
sources = ["src/digiqual_desktop"]
requires = ["digiqual==0.26.2"]
console_app = false

[tool.briefcase.app.digiqual-desktop.windows]
# Per-user MSI: installs to %LOCALAPPDATA%\Programs without admin rights.
system_installer = false

[tool.briefcase.app.digiqual-desktop.macOS]
universal_build = false
