project:
  type: website
  resources:
    - "/optimise_examples/"
  output-dir: _site
  render:
    - "*.qmd"
    - "docs/"
    - "api_reference/"
    - "!materials/"
    - "!todo.qmd"

execute:
  warning: false
  message: false
  freeze: auto

website:
  title: "digiqual"
  # Logo + favicon are generated by scripts/make_icon.py (same design as the app icon)
  favicon: docs/www/favicon.png
  repo-url: https://github.com/JGIBristol/digiqual
  repo-actions: [edit, issue]
  page-navigation: true

  navbar:
    logo: docs/www/digiqual-logo.png
    logo-alt: "digiqual logo"
    background: primary
    foreground: light
    search: true
    right:
      - icon: github
        href: https://github.com/JGIBristol/digiqual
        aria-label: GitHub

# --- 1. YOUR MANUAL SIDEBAR ---
  sidebar:
    style: floating
    collapse-level: 1
    search: true
    contents:
      - text: "Home"
        href: index.qmd

      - section: "Getting Started"
        contents:
          - text: "Installation & Setup"
            href: docs/install.qmd
          - text: "Python Quick Start"
            href: docs/qs_class.qmd
          - text: "Launch the App"
            href: docs/gui.qmd

      - section: "User Guides"
        contents:
          - text: "GUI Desktop Manual"
            href: docs/gui_manual.qmd
          - text: "Automated Optimisation"
            href: docs/optimisation.qmd

      - section: "Theory"
        contents:
          - text: "Generalised PoD"
            href: docs/generalised_pod.qmd
          - text: "Kriging Metamodeling"
            href: docs/kriging_metamodeling.qmd

      - section: "Development"
        contents:
          - text: "Caching Architecture"
            href: docs/caching.qmd
          - text: "C++ Acceleration & Fallback"
            href: docs/cpp_acceleration.qmd
          - text: "Desktop App Architecture"
            href: docs/app_architecture.qmd

      - text: "API Reference"
        href: api_reference/index.qmd


format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    page-layout: article
    # Widen the central text column (Quarto's default body-width is 800px) so
    # code blocks and side-by-side figures have room; sidebar and TOC unchanged.
    grid:
      body-width: 1000px
    code-copy: true
    mainfont: "Inter, system-ui, -apple-system, sans-serif"
    fontcolor: "#212529"
    backgroundcolor: "#f9fafb"

# --- 2. QUARTODOC CONFIG ---
# The API reference is generated from the code: each module below is documented
# with every object in its `__all__`, using the objects' (Google-style) docstrings.
# A new public function therefore appears automatically once it is added to its
# module's `__all__`; tests/test_docstrings.py fails until it is (and until its
# docstring documents every argument and the return value).
# Build with `just build_website` / `just preview` (they run `quartodoc build`).
quartodoc:
  package: digiqual
  dir: api_reference
  parser: google
  title: "API Reference"

  options:
    signature_name: short
    children: separate   # one page per function/class, linked from its module's page

  sections:
    - title: "Standard Workflow"
      desc: "The `SimulationStudy` class runs the whole analysis: diagnostics, refinement, model fitting, PoD and plots. Most users only need this and `dq_ui`."
      contents:
        - core.SimulationStudy
        - dq_ui

    - title: "Functional API"
      desc: "The building blocks `SimulationStudy` uses, for custom workflows. Each module lists its functions."
      contents:
        - name: core
          exclude: [SimulationStudy]
        - io
        - sampling
        - diagnostics
        - adaptive
        - pod
        - integration
        - ahat
        - plotting
        - executors

    - title: "Settings and Acceleration"
      desc: "Default thresholds and levels shared by the library and the app, and the C++ kernels with their NumPy fallback."
      contents:
        - name: defaults
          children: embedded
        - cpp_fallback
