project:
  type: website
  resources:
    - "/optimise_examples/"
  output-dir: _site
  render:
    - "*.qmd"
    - "docs/"
    - "api_reference/"
    - "!materials/"
    - "!todo.qmd"

execute:
  warning: false
  message: false
  freeze: auto

website:
  title: "digiqual"
  # Logo + favicon are generated by scripts/make_icon.py (same design as the app icon)
  favicon: docs/www/favicon.png
  repo-url: https://github.com/JGIBristol/digiqual
  repo-actions: [edit, issue]
  page-navigation: true

  navbar:
    logo: docs/www/digiqual-logo.png
    logo-alt: "digiqual logo"
    background: primary
    foreground: light
    search: true
    right:
      - icon: github
        href: https://github.com/JGIBristol/digiqual
        aria-label: GitHub

# --- 1. YOUR MANUAL SIDEBAR ---
  sidebar:
    style: floating
    collapse-level: 1
    search: true
    contents:
      - text: "Home"
        href: index.qmd

      - section: "Getting Started"
        contents:
          - text: "Installation & Setup"
            href: docs/install.qmd
          - text: "Python Quick Start"
            href: docs/qs_class.qmd
          - text: "Launch the App"
            href: docs/gui.qmd

      - section: "User Guides"
        contents:
          - text: "GUI Desktop Manual"
            href: docs/gui_manual.qmd
          - text: "Automated Optimisation"
            href: docs/optimisation.qmd

      - section: "Theory"
        contents:
          - text: "Generalised PoD"
            href: docs/generalised_pod.qmd
          - text: "Kriging Metamodeling"
            href: docs/kriging_metamodeling.qmd

      - section: "Development"
        contents:
          - text: "Caching Architecture"
            href: docs/caching.qmd
          - text: "C++ Acceleration & Fallback"
            href: docs/cpp_acceleration.qmd
          - text: "Desktop App Architecture"
            href: docs/app_architecture.qmd

      - text: "API Reference"
        href: api_reference/index.qmd


format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    page-layout: article
    # Widen the central text column (Quarto's default body-width is 800px) so
    # code blocks and side-by-side figures have room; sidebar and TOC unchanged.
    grid:
      body-width: 1000px
    code-copy: true
    mainfont: "Inter, system-ui, -apple-system, sans-serif"
    fontcolor: "#212529"
    backgroundcolor: "#f9fafb"

# --- 2. QUARTODOC CONFIG ---
quartodoc:
  package: digiqual
  dir: api_reference
  parser: google
  title: "All Functions"

  # Global Options
  options:
    dynamic: true
    signature_name: short

  # --- 3. PAGE GENERATION ---
  # This builds the content for "api_reference/index.qmd"
  sections:
    # SECTION A: THE STANDARD USER
    - title: "Standard Workflow"
      desc: "The core class for managing reliability studies."
      contents:
        - name: core.SimulationStudy
          children: separate

    # SECTION B: THE DESKTOP APP
    - title: "Graphical User Interface"
      desc: "Launch the standalone DigiQual dashboard locally."
      contents:
        - dq_ui

    # SECTION C: THE POWER USER
    - title: "Functional API"
      desc: "Standalone tools for sampling, diagnostics, refinement, PoD, integration, plotting and solver execution, plus the shared default settings."
      contents:
        # -- Sampling --
        - sampling.generate_lhs
        - sampling.reorder_max_min

        # -- Diagnostics --
        - diagnostics.validate_simulation
        - diagnostics.sample_sufficiency
        - diagnostics.check_input_coverage
        - diagnostics.bootstrap_convergence_trace
        - diagnostics.relative_spread
        - diagnostics.ValidationError

        # -- Adaptive --
        - adaptive.run_adaptive_search
        - adaptive.generate_targeted_samples

        # -- PoD Analysis --
        - pod.fit_all_robust_mean_models
        - pod.select_cv_winner
        - pod.generate_latex_equation
        - pod.optimise_bandwidth
        - pod.fit_variance_model
        - pod.infer_best_distribution
        - pod.plot_model_selection
        - pod.predict_local_std
        - pod.ScaledGaussianProcessRegressor
        - pod.build_kriging_candidate_kernels
        - pod.build_kriging_gpr
        - pod.build_fixed_kernel_gpr
        - pod.compute_kriging_loo_residuals
        - pod.compute_kriging_group_loo_means
        - pod.compute_pod_curve
        - pod.bootstrap_pod_ci
        - pod.calculate_reliability_point
        - pod.calculate_sobol_indices
        - pod.reliability_matrix
        - pod.polynomial_raw_coefficients
        - pod.build_polynomial_model
        - pod.build_refit_model

        # -- Model selection helpers --
        - core.model_key_args
        - core.model_override_args

        # -- Integration --
        - integration.compute_multi_dim_pod
        - integration.estimate_nuisance_distribution
        - name: integration.NUISANCE_DISTRIBUTIONS
          dynamic: false

        # -- Classical Linear PoD --
        - ahat.fit_linear_a_hat_model
        - ahat.compute_linear_pod_curve
        - ahat.bootstrap_linear_pod_ci
        - ahat.plot_linear_signal_model

        # -- Plotting --
        - plotting.plot_signal_model
        - plotting.plot_pod_curve
        - plotting.plot_pod_vs_threshold
        - plotting.plot_pod_surface
        - plotting.plot_signal_surface
        - plotting.plot_collinearity_matrix
        - plotting.plot_kriging_diagnostics

        # -- Optimise/Executor --
        - executors.Executor
        - executors.PythonExecutor
        - executors.CLIExecutor
        - executors.MatlabExecutor

        # -- Defaults --
        - name: defaults
          dynamic: false

    # SECTION D: READING RESULTS
    - title: "I/O"
      desc: "Read simulation results from CSV files, cleaned exactly as the app does."
      contents:
        - io.read_results_csv
        - io.clean_columns
