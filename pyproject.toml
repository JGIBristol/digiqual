[project]
name = "digiqual"
version = "0.27.1"
description = "Statistical Toolkit for Reliability Assessment in NDT"
authors = [
  {name = "Josh Tyler", email = "josh.tyler@bristol.ac.uk"}
]

readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.9.4",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
    "shiny",
    "faicons",
    "pywebview>=5.0",
    "openpyxl>=3.1.5",
    "salib>=1.5.2",
]

[build-system]
# setuptools 77+ is needed for the SPDX `license` string and `license-files`.
requires = ["setuptools>=77", "pybind11>=2.12.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Matches the Python versions exercised by `just test_matrix`.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
# Import the extension directly (`import digiqual` alone would pass even if it
# were missing, since cpp_fallback silently falls back to NumPy), then run the
# test suite against the built wheel.
test-requires = ["pytest", "psutil"]
test-command = "python -c \"import digiqual._digiqual_cpp\" && pytest {project}/tests -q"

[tool.cibuildwheel.macos]
# Keeps wheels installable on older macOS, avoiding libc++ deprecation warnings
# (same deployment target `just test_matrix` sets for local Apple Silicon builds).
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# Development-only tools. These are uv dependency groups (not published
# extras), installed by default by `uv sync` / `uv run` via `default-groups`.
[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "psutil",
    "ruff>=0.16.1",
    # Not a runtime dependency (wheels ship the compiled extension), but
    # `setup.py build_ext --inplace` (just test_matrix) runs in the project env.
    "pybind11>=2.12.0",
]
docs = [
    "quartodoc",
    "jupyter",
    "nbformat",
]

[tool.uv]
default-groups = ["dev", "docs"]


[project.optional-dependencies]
linux-gui = [
    "pywebview[qt]"
]

[tool.pytest.ini_options]
# The memory stress test is slow and machine-dependent; run it explicitly with
# `uv run pytest -m stress`.
addopts = "-m 'not stress'"
markers = [
    "stress: marks tests as stress tests (deselect with '-m \"not stress\"')",
]
filterwarnings = [
    "ignore:invalid value encountered in sqrt:RuntimeWarning:scipy.stats._continuous_distns",
    "ignore:The iteration is not making good progress.*:RuntimeWarning:scipy.stats._continuous_distns",
]


[project.urls]
Documentation = "https://jgibristol.github.io/digiqual/"
Source = "https://github.com/JGIBristol/digiqual"

[project.gui-scripts]
digiqual = "digiqual.gui.launcher:main"


[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["materials", "_freeze", "_site", "app/build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "I"]
ignore = ["E501"]
