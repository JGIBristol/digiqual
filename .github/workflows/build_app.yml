name: Build App Executables

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Digiqual-Windows-x64
            archive_path: app/dist/Digiqual-Windows-x64.zip
          - os: macos-latest
            artifact_name: Digiqual-macOS
            archive_path: app/dist/Digiqual-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .

      # Windows Build Step
      - name: Build App Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File .github/scripts/windows/build.ps1

      # Comprehensive Windows Integrity, File & HTTP Startup Check
      - name: Validate Windows Build Integrity & Startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File .github/scripts/windows/validate.ps1

      # Upload startup logs regardless of outcome, so failures are debuggable from the run
      - name: Upload Windows Startup Logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Digiqual-Windows-startup-logs
          path: |
            app/dist/digiqual-stdout.log
            app/dist/digiqual-stderr.log
          retention-days: 14
          if-no-files-found: ignore

      # Packaging step for Windows
      - name: Compress Windows Executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "app/dist/Digiqual" -DestinationPath "app/dist/Digiqual-Windows-x64.zip"

      # macOS Build Step
      - name: Build App Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          # PyInstaller flags live in digiqual.spec, shared with the Windows
          # build, so the two platforms' bundling configuration can't
          # silently drift apart.
          uv run pyinstaller digiqual.spec --noconfirm

          ditto -c -k --sequesterRsrc --keepParent "dist/Digiqual.app" "dist/Digiqual-macOS.zip"

      # Upload the final archive for each OS
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          retention-days: 90
