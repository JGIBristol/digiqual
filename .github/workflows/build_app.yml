name: Build App Executables

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Digiqual-Windows-x64
            archive_path: app/dist/Digiqual-Windows-x64.zip
          - os: macos-latest
            artifact_name: Digiqual-macOS
            archive_path: app/dist/Digiqual-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .

      # Windows requires pythonnet installed in the build environment for PyInstaller to bundle it
      - name: Install Windows GUI dependencies
        if: runner.os == 'Windows'
        run: |
          uv pip install pythonnet

      # Windows Build Step
      - name: Build App Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app
          uv run pyinstaller --name "Digiqual" `
            --noconfirm `
            --windowed `
            --collect-all digiqual `
            --collect-all shiny `
            --collect-all faicons `
            --collect-all shinyswatch `
            --collect-all htmltools `
            --collect-all pywebview `
            --collect-all matplotlib `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --collect-binaries webview `
            --hidden-import="uvicorn.loops.auto" `
            --hidden-import="uvicorn.protocols.http.auto" `
            --hidden-import="uvicorn.lifespan.on" `
            --hidden-import="engineio.async_drivers.threading" `
            run_app.py

      # Verification step: runs on the Windows virtual machine to confirm no missing DLL errors
      - name: Verify Windows Executable Startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Verifying Digiqual.exe launches without fatal DLL/runtime exceptions..."
          # Start the process in the background
          $proc = Start-Process -FilePath "app/dist/Digiqual/Digiqual.exe" -PassThru

          # Wait 8 seconds to allow .NET, pythonnet, and pywebview initialization
          Start-Sleep -Seconds 8

          # If the process terminated prematurely, it likely encountered the unhandled startup error
          if ($proc.HasExited -and$proc.ExitCode -ne 0) {
              Write-Error "Digiqual.exe crashed immediately on startup with exit code $($proc.ExitCode)!"
              exit 1
          }

          # Cleanly terminate the test instance
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Digiqual.exe successfully launched without initialization crashes."

      # Packaging step for Windows
      - name: Compress Windows Executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "app/dist/Digiqual" -DestinationPath "app/dist/Digiqual-Windows-x64.zip"

      # macOS Build Step
      - name: Build App Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          uv run pyinstaller --name "Digiqual" \
            --noconfirm \
            --windowed \
            --collect-all digiqual \
            --collect-all shiny \
            --collect-all faicons \
            --collect-all shinyswatch \
            --collect-all htmltools \
            --collect-all pywebview \
            --collect-all matplotlib \
            --collect-binaries webview \
            --hidden-import="uvicorn.loops.auto" \
            --hidden-import="uvicorn.protocols.http.auto" \
            --hidden-import="uvicorn.lifespan.on" \
            --hidden-import="engineio.async_drivers.threading" \
            run_app.py

          ditto -c -k --sequesterRsrc --keepParent "dist/Digiqual.app" "dist/Digiqual-macOS.zip"

      # Upload the final archive for each OS
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          retention-days: 90
