name: Build App Executables

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Digiqual-Windows-x64
            archive_path: app/dist/Digiqual-Windows-x64.zip
          - os: macos-latest
            artifact_name: Digiqual-macOS
            archive_path: app/dist/Digiqual-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .

      # Windows Build Step
      - name: Build App Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd app
          uv pip install pythonnet
          uv run pyinstaller --name "Digiqual" `
            --noconfirm `
            --windowed `
            --collect-all digiqual `
            --collect-all shiny `
            --collect-all faicons `
            --collect-all shinyswatch `
            --collect-all htmltools `
            --collect-all pywebview `
            --collect-all matplotlib `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --collect-binaries webview `
            --hidden-import="uvicorn.loops.auto" `
            --hidden-import="uvicorn.protocols.http.auto" `
            --hidden-import="uvicorn.lifespan.on" `
            --hidden-import="engineio.async_drivers.threading" `
            run_app.py

          # Create .NET config to allow loading assemblies from OneDrive / remote directories
          $configContent = @"
          <configuration>
            <runtime>
              <loadFromRemoteSources enabled="true"/>
            </runtime>
          </configuration>
          "@
          Set-Content -Path "dist/Digiqual/Digiqual.exe.config" -Value $configContent

      # Comprehensive Windows Integrity & Smoke Test
      - name: Validate Windows Build Integrity & Startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "🔍 Running Windows Build Integrity Checks..."

          # 1. Check for Primary Executable
          $exePath = "app/dist/Digiqual/Digiqual.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "❌ Missing primary executable: $exePath"
              exit 1
          }
          Write-Host "  ✔ Found Digiqual.exe"

          # 2. Check for App Config file
          $configPath = "app/dist/Digiqual/Digiqual.exe.config"
          if (-not (Test-Path $configPath)) {
              Write-Error "❌ Missing configuration file: $configPath"
              exit 1
          }
          Write-Host "  ✔ Found Digiqual.exe.config"

          # 3. Check for core Python DLL
          $pyDll = Get-ChildItem -Path "app/dist/Digiqual" -Recurse -Filter "python3*.dll" | Select-Object -First 1
          if (-not $pyDll) {
              Write-Error "❌ Could not find python3*.dll inside build bundle!"
              exit 1
          }
          Write-Host "  ✔ Found Python DLL at: $($pyDll.FullName)"

          # 4. Check for pythonnet runtime library
          $pythonnetDll = Get-ChildItem -Path "app/dist/Digiqual" -Recurse -Filter "Python.Runtime.dll" | Select-Object -First 1
          if (-not $pythonnetDll) {
              Write-Error "❌ Missing Python.Runtime.dll required by pythonnet!"
              exit 1
          }
          Write-Host "  ✔ Found Python.Runtime.dll at: $($pythonnetDll.FullName)"

          # 5. Launch the process and verify health
          Write-Host "🚀 Launching Digiqual.exe to test process startup and stability..."
          $proc = Start-Process -FilePath$exePath -PassThru

          # Wait 8 seconds to allow the process, .NET loader, and server thread to spin up
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
              Write-Error "❌ Digiqual.exe terminated prematurely with exit code $($proc.ExitCode)!"
              exit 1
          }

          Write-Host "  ✔ Process stayed alive without early runtime exceptions (PID: $($proc.Id))"

          # Cleanly terminate the test process
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "✅ All Windows verification checks passed successfully!"

      # Packaging step for Windows
      - name: Compress Windows Executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "app/dist/Digiqual" -DestinationPath "app/dist/Digiqual-Windows-x64.zip"

      # macOS Build Step
      - name: Build App Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          cd app
          uv run pyinstaller --name "Digiqual" \
            --noconfirm \
            --windowed \
            --collect-all digiqual \
            --collect-all shiny \
            --collect-all faicons \
            --collect-all shinyswatch \
            --collect-all htmltools \
            --collect-all pywebview \
            --collect-all matplotlib \
            --collect-binaries webview \
            --hidden-import="uvicorn.loops.auto" \
            --hidden-import="uvicorn.protocols.http.auto" \
            --hidden-import="uvicorn.lifespan.on" \
            --hidden-import="engineio.async_drivers.threading" \
            run_app.py

          ditto -c -k --sequesterRsrc --keepParent "dist/Digiqual.app" "dist/Digiqual-macOS.zip"

      # Upload the final archive for each OS
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          retention-days: 90
